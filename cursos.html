<!DOCTYPE html>
<html lang="es-MX">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cursos Especializados | Grupo Holandés</title>
  <meta name="description" content="Bootcamps y talleres cortos: Mecánica Preventiva para Mujeres Biker y más. Fecha, temario, cupo e inscripción.">
  <link rel="stylesheet" href="/css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
<div id="gh-header"></div>
<div class="page-hero"><div class="container"><h1>Cursos <span class="highlight">especializados</span></h1><p>Talleres cortos y bootcamps intensivos, independientes de las especialidades.</p></div></div>
<main class="page-body"><div class="container">
  <div class="filters"><select id="cx-campus"><option value="">Todos los planteles</option></select></div>
  <div class="grid-cards" id="courses-grid"></div>
</div></main>
<div id="gh-footer"></div>
<script src="/data/app-config.js"></script>
<script src="/data/campuses.js"></script>
<script src="/data/specialties.js"></script>
<script src="/data/courses.js"></script>
<script src="/js/app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const sel = document.getElementById('cx-campus');
  sel.innerHTML += GH.campuses().map(c => `<option value="${c.id}">${GH.esc(c.nombre)}</option>`).join('');
  const cname = id => { const p = GH.campusById(id); return p ? p.nombre : id; };
  const fmtF = f => { try { return new Date(f + 'T12:00:00').toLocaleDateString('es-MX', { weekday: 'long', day: 'numeric', month: 'long' }); } catch (e) { return f; } };

  function card(c) {
    const fechas = (c.fechas || []).filter(Boolean);
    return `<div class="info-card" data-course="${c.id}">
    <div class="service-icon">${c.icon}</div><h3>${GH.esc(c.nombre)}</h3>
    <p class="muted">📍 ${(c.planteles || []).map(cname).map(GH.esc).join(' · ')}</p>
    <p><button class="btn-primary btn-sm" data-toggle="${c.id}">Ver detalles</button></p>
    <div class="course-detail" id="cd-${c.id}" style="display:none">
      ${fechas.length
        ? `<h4>Próximas fechas disponibles</h4><div class="radio-row">${fechas.map(f => `<label><input type="radio" name="fx-${c.id}" value="${f}"> ${fmtF(f)}</label>`).join('')}</div>`
        : `<p class="muted">Sin fechas programadas por el momento.</p>`}
      <p><button class="btn-submit btn-sm" data-apartar="${c.id}">Apartar lugar</button></p>
      <form class="apart-form" id="af-${c.id}" style="display:none" novalidate>
        <div class="form-group"><label>Nombre completo *</label><input data-f="nombre" placeholder="Ej. Juan Pérez" autocomplete="name"></div>
        <div class="form-group"><label>Número telefónico (10 dígitos) *</label><input data-f="telefono" placeholder="Ej. 9511234567" inputmode="tel" maxlength="18" autocomplete="tel"></div>
        <div class="form-group"><label>Curso elegido</label><input value="${GH.esc(c.nombre)}" disabled></div>
        <div class="form-group"><label>Plantel *</label><select data-f="plantel">${(c.planteles || []).map(pid => { const p = GH.campusById(pid); return p ? `<option value="${p.id}">${GH.esc(p.nombre)}</option>` : ''; }).join('')}</select></div>
        <div class="form-group"><label>Fecha</label><select data-f="fecha">${fechas.length ? fechas.map(f => `<option value="${f}">${fmtF(f)}</option>`).join('') : ''}<option value="">A convenir / lista de espera</option></select></div>
        <div class="form-error" id="ae-${c.id}"></div>
        <button class="btn-whatsapp-plantel" type="submit">💬 Enviar por WhatsApp</button>
      </form>
    </div></div>`;
  }
  function render(cid) {
    const list = getAllActiveCourses().filter(c => !cid || (c.planteles || []).includes(cid));
    document.getElementById('courses-grid').innerHTML = list.map(card).join('')
      || '<p class="muted">Sin cursos en este plantel por ahora.</p>';
  }
  sel.addEventListener('change', () => render(sel.value));
  render('');

  document.getElementById('courses-grid').addEventListener('click', e => {
    const t = e.target.closest('[data-toggle]');
    if (t) {
      const d = document.getElementById('cd-' + t.dataset.toggle);
      const open = d.style.display !== 'none';
      d.style.display = open ? 'none' : 'block';
      t.textContent = open ? 'Ver detalles' : 'Ocultar';
      return;
    }
    const a = e.target.closest('[data-apartar]');
    if (a) {
      const c = getCourseById(a.dataset.apartar);
      const f = document.getElementById('af-' + c.id);
      const picked = document.querySelector(`input[name="fx-${c.id}"]:checked`);
      const fsel = f.querySelector('[data-f="fecha"]');
      if (picked && fsel) fsel.value = picked.value;
      f.style.display = f.style.display === 'none' ? 'block' : 'none';
      f.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
  });

  document.getElementById('courses-grid').addEventListener('submit', async e => {
    const form = e.target.closest('.apart-form');
    if (!form) return;
    e.preventDefault();
    const cid = form.id.replace('af-', '');
    const c = getCourseById(cid);
    const g = n => (form.querySelector(`[data-f="${n}"]`) || {}).value || '';
    const err = document.getElementById('ae-' + cid);
    const nombre = g('nombre').trim();
    const tel = GH.normPhone(g('telefono'));
    if (nombre.length < 2) { err.textContent = 'Escribe tu nombre completo.'; err.scrollIntoView({ behavior: 'smooth', block: 'center' }); return; }
    if (!tel) { err.textContent = 'Escribe un número mexicano de 10 dígitos (puedes incluir +52).'; err.scrollIntoView({ behavior: 'smooth', block: 'center' }); return; }
    if (!g('plantel')) { err.textContent = 'Elige tu plantel.'; return; }
    err.textContent = '';
    const btn = form.querySelector('button[type="submit"]');
    btn.disabled = true; btn.textContent = 'Enviando…';
    const p = GH.campusById(g('plantel'));
    const fecha = g('fecha');
    const fechaTxt = fecha ? fmtF(fecha) : 'A convenir / lista de espera';
    // 1) Registrar en Prospectos (backend o Netlify + Google Sheets "Prospectos GH")
    try {
      await GH.sendLeadSmart({
        nombre, telefono: tel, especialidad: 'Curso: ' + c.nombre, especialidades: [],
        plantel: p.nombre, plantelId: p.id,
        comentarios: `Apartado de lugar · Fecha: ${fechaTxt}`,
        origen: 'cursos-apartado', canalPreferido: 'whatsapp'
      });
    } catch (ex) { /* se continúa a WhatsApp aunque falle el registro */ }
    // 2) Enviar por WhatsApp al plantel
    const msg = `🎓 *APARTADO DE LUGAR - ${c.nombre}*%0A%0A` +
      `👤 *Nombre:* ${encodeURIComponent(nombre)}%0A` +
      `📞 *Teléfono:* ${tel}%0A` +
      `📚 *Curso:* ${encodeURIComponent(c.nombre)}%0A` +
      `📍 *Plantel:* ${encodeURIComponent(p.nombre)}%0A` +
      `📅 *Fecha:* ${encodeURIComponent(fechaTxt)}`;
    GHtrack('whatsapp_click', { context: 'apartado-' + cid });
    window.open(`https://wa.me/${(p.whatsapp || '529515678678').replace(/\D/g, '')}?text=${msg}`, '_blank');
    btn.disabled = false; btn.textContent = '💬 Enviar por WhatsApp';
    err.textContent = '✅ Lugar apartado. Te contactaremos para confirmar.';
  });
});
</script>
</body>
</html>
