<!DOCTYPE html>
<html lang="es-MX">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cursos Especializados | Grupo Holandés</title>
  <meta name="description" content="Bootcamps y talleres cortos: Mecánica Preventiva para Mujeres Biker y más. Fecha, temario, cupo e inscripción.">
  <link rel="stylesheet" href="/css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
<div id="gh-header"></div>
<div class="page-hero"><div class="container"><h1>Cursos <span class="highlight">especializados</span></h1><p>Talleres cortos y bootcamps intensivos, independientes de las especialidades.</p></div></div>
<main class="page-body"><div class="container">
  <div class="filters"><select id="cx-campus"><option value="">Todos los planteles</option></select></div>
  <div class="grid-cards" id="courses-grid"></div>
</div></main>
<div id="gh-footer"></div>
<script src="/data/app-config.js"></script>
<script src="/data/campuses.js"></script>
<script src="/data/specialties.js"></script>
<script src="/data/courses.js"></script>
<script src="/js/app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const sel = document.getElementById('cx-campus');
  sel.innerHTML += GH.campuses().map(c => `<option value="${c.id}">${GH.esc(c.nombre)}</option>`).join('');
  const cname = id => { const p = GH.campusById(id); return p ? p.nombre : id; };
  function render(cid) {
    const list = getAllActiveCourses().filter(c => !cid || (c.planteles || []).includes(cid));
    document.getElementById('courses-grid').innerHTML = list.map(c => `
    <div class="info-card"><div class="service-icon">${c.icon}</div><h3>${GH.esc(c.nombre)}</h3>
    <p>📅 ${GH.esc(c.fecha)} · ⏱ ${GH.esc(c.duracion)}<br>🕐 ${GH.esc(c.horario)}<br>💰 ${GH.esc(c.precio)} · 👥 Cupo: ${c.cupo}</p>
    <p class="muted">📍 Disponible en: ${(c.planteles || []).map(cname).map(GH.esc).join(' · ')}</p>
    <h4>Temario</h4><ul class="mod-list">${c.temario.map(t => `<li>✅ ${GH.esc(t)}</li>`).join('')}</ul>
    <p class="muted">Requisitos: ${c.requisitos.map(GH.esc).join(' · ')}</p>
    <p><a class="btn-primary btn-sm" href="/registro">Inscribirme</a> <a href="#" data-wa data-context="curso-${c.id}" data-msg="Hola, quiero inscribirme al curso ${GH.esc(c.nombre)}.">💬 WhatsApp</a></p></div>`).join('')
    || '<p class="muted">Sin cursos en este plantel por ahora.</p>';
  }
  sel.addEventListener('change', () => render(sel.value));
  render('');
});
</script>
</body>
</html>
