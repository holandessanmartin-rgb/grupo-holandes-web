<!DOCTYPE html>
<html lang="es-MX">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seguimiento | Admin Grupo Holandés</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="/css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="icon" href="/img/logotipo.png" type="image/png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Seguimiento | Admin Grupo Holandés">
  <meta name="twitter:image" content="https://grupo-holandes-web.onrender.com/img/logotipo.png">
</head>
<body>
<div id="gh-header"></div>
<div class="page-hero"><div class="container"><h1>Seguimiento de <span class="highlight">prospectos</span></h1><p>Recupera a quienes no agendaron (48h) o no se inscribieron (7 días).</p></div></div>
<main class="page-body"><div class="container">
  <div class="filters">
    <select id="s-plantel"><option value="">Todos los planteles</option></select>
    <label class="muted"><input type="checkbox" id="s-test"> Incluir pruebas</label>
    <button class="btn-primary btn-sm" id="s-go">Buscar pendientes</button>
  </div>
  <div class="info-card" style="margin-bottom:20px"><h3>🔔 Sin cita (48h+ sin agendar)</h3>
    <div class="table-wrap"><table class="admin-table"><thead><tr><th>Nombre</th><th>Teléfono</th><th>Plantel</th><th>Especialidad</th><th>Hace</th><th>Acción</th></tr></thead><tbody id="s-sincita"></tbody></table></div>
  </div>
  <div class="info-card"><h3>📝 Sin inscripción (cita hace 7+ días)</h3>
    <div class="table-wrap"><table class="admin-table"><thead><tr><th>Nombre</th><th>Teléfono</th><th>Plantel</th><th>Especialidad</th><th>Hace</th><th>Acción</th></tr></thead><tbody id="s-sininsc"></tbody></table></div>
  </div>
</div></main>
<div id="gh-footer"></div>
<script src="/data/app-config.js"></script>
<script src="/data/campuses.js"></script>
<script src="/data/specialties.js"></script>
<script src="/js/app.js"></script>
<script src="/js/admin.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  if (!sessionStorage.getItem('gh_admin_key') && !sessionStorage.getItem('gh_user')) { location.href = '/admin'; return; }
  document.getElementById('s-plantel').innerHTML += GH.campuses().map(c => `<option>${GH.esc(c.nombre)}</option>`).join('');
  try {
    const u = JSON.parse(sessionStorage.getItem('gh_user') || 'null');
    if (u && u.rol === 'encargado' && u.plantel) {
      const sel = document.getElementById('s-plantel');
      sel.value = u.plantel;
      sel.disabled = true;
      sel.title = 'Tu cuenta solo ve ' + u.plantel;
    }
  } catch (e) { /* noop */ }
  const base = APP_CONFIG.sheetsWebhookUrl;
  const key = sessionStorage.getItem('gh_admin_key') || '';
  function waLink(tel, msg) {
    let d = String(tel || '').replace(/\D/g, '');
    if (d.length === 12 && d.startsWith('52')) d = d.slice(2);
    return 'https://wa.me/52' + d + '?text=' + encodeURIComponent(msg);
  }
  function row(x, tipo) {
    const msg = tipo === 'cita'
      ? `Hola ${x.nombre}, vimos tu interés en ${x.especialidad} (${x.plantel}). ¿Te ayudamos a agendar tu visita? Tu cupón ${x.cupon || 'sigue válido'}.`
      : `Hola ${x.nombre}, ¿cómo vas con tu inscripción a ${x.especialidad}? Quedan pocos lugares en ${x.plantel}.`;
    return `<tr><td><strong>${GH.esc(x.nombre)}</strong></td><td>${GH.esc(x.telefono)}</td><td>${GH.esc(x.plantel)}</td><td>${GH.esc(x.especialidad)}</td><td>${x.dias}d</td>
    <td><button class="btn-whatsapp-plantel btn-sm" data-tel="${GH.esc(x.telefono)}" data-msg="${GH.esc(msg)}" data-nombre="${GH.esc(x.nombre)}" data-plantel="${GH.esc(x.plantel)}">💬 Contactar</button></td></tr>`;
  }
  async function load() {
    const pl = document.getElementById('s-plantel').value;
    const tt = document.getElementById('s-test').checked ? '&test=1' : '';
    try {
      const r = await fetch(base + '?action=seguimiento&plantel=' + encodeURIComponent(pl) + tt);
      const d = await r.json();
      document.getElementById('s-sincita').innerHTML = (d.sinCita || []).map(x => row(x, 'cita')).join('') || '<tr><td colspan="6" class="muted">Sin pendientes. 🎉</td></tr>';
      document.getElementById('s-sininsc').innerHTML = (d.sinInscripcion || []).map(x => row(x, 'insc')).join('') || '<tr><td colspan="6" class="muted">Sin pendientes. 🎉</td></tr>';
    } catch (e) { alert('No se pudo cargar. Verifica la versión del Apps Script.'); }
  }
  document.getElementById('s-go').addEventListener('click', load);
  document.addEventListener('click', e => {
    const b = e.target.closest('[data-tel]');
    if (!b) return;
    try { GH.logEvento('seguimiento', { nombre: b.dataset.nombre, telefono: b.dataset.tel, plantel: b.dataset.plantel, detalle: 'contacto asesor' }); } catch (err) {}
    window.open(waLink(b.dataset.tel, b.dataset.msg), '_blank');
  });
  load();
});
</script>
</body>
</html>
