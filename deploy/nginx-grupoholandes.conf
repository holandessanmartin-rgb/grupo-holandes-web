# Nginx — proxy + caché de estáticos + gzip. Dominio: CAMBIAR.
# Instalar en: /etc/nginx/sites-available/grupoholandes
upstream grupo_holandes {
  server 127.0.0.1:3100;
}

server {
  listen 80;
  server_name tudominio.mx www.tudominio.mx;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  location ~* \.(css|js|png|jpg|jpeg|webp|ico|woff2?)$ {
    proxy_pass http://grupo_holandes;
    proxy_cache_valid 200 7d;
    add_header Cache-Control "public, max-age=604800";
  }

  location / {
    proxy_pass http://grupo_holandes;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
# Después: certbot --nginx -d tudominio.mx -d www.tudominio.mx
