<!DOCTYPE html>
<html lang="es-MX">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grupo Holandés | Escuela de Mecánica Automotriz — Aprende, Emprende, Repara</title>
  <meta name="description" content="Formación práctica en mecánica automotriz y motocicletas. 90% prácticas, vehículos reales desde el primer día. 19 planteles. Plantel San Martín, Oaxaca.">
  <link rel="canonical" href="/">
  <meta property="og:title" content="Grupo Holandés — Aprende, Emprende, Repara">
  <meta property="og:description" content="Formación práctica en mecánica automotriz y motocicletas. 90% prácticas.">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Grupo Holandés | Escuela de Mecánica Automotriz — Aprende, Emprende, Repara">
  <meta name="twitter:image" content="https://grupo-holandes-web.onrender.com/img/logotipo.png">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://grupo-holandes-web.onrender.com/img/logotipo.png">
  <link rel="icon" href="/img/logotipo.png" type="image/png">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script type="application/ld+json">
  {"@context":"https://schema.org","@type":"EducationalOrganization","name":"Grupo Holandés — Escuela de Mecánica Automotriz","telephone":"+52 951 567 8678","address":{"@type":"PostalAddress","streetAddress":"Calle Tierra y Libertad #100 A, Col. Ejidal San Martín Montoya","addressLocality":"Oaxaca de Juárez","addressRegion":"Oaxaca","addressCountry":"MX"}}
  </script>
</head>
<body>

<main class="solo-main">
<header class="hero hero--solo" id="inicio">
  <div class="container">
    <div class="hero-content">
      <h1 class="mega">📍 LOCALIZA EL PLANTEL <span class="highlight">MÁS CERCANO</span></h1>
      <p class="hero-description">Estudia mecánica <strong>cerca de ti</strong>: 90% prácticas, vehículos reales desde el primer día.</p>
      <div class="hero-finder" id="hero-finder">
        <button class="btn-primary" id="hero-geo">📍 Usar mi ubicación</button>
        <p class="hero-micro">o busca manualmente:</p>
        <input type="search" id="hero-q" class="finder-input" placeholder="Ciudad, colonia o plantel…" autocomplete="off">
        <p class="map-note" id="hero-note"></p>
        <div id="hero-result"></div>
      </div>
      <p class="hero-more"><a href="/menu" class="btn-outline" data-track="menu_click">¿Quieres saber más? →</a></p>
    </div>
    <div class="hero-visual">
      <div class="hero-logo-container">
        <img src="/img/logotipo.png" alt="Logo Grupo Holandés" class="hero-main-logo">
        <div class="hero-logo-glow"></div>
      </div>
    </div>
  </div>
  </header>
</main>


<script src="/data/app-config.js"></script>
<script src="/data/campuses.js"></script>
<script src="/data/specialties.js"></script>
<script src="/js/app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  /* Flujo exprés: ubica → elige plantel → marca especialidades → WhatsApp */
  const preSpecs = (new URLSearchParams(location.search).get('especialidad') || '').split(',').filter(Boolean);
  const note = document.getElementById('hero-note');
  const result = document.getElementById('hero-result');
  const specName = id => { const s = GH.specialties().find(x => x.id === id); return s ? s.nombre : id; };

  function showCampus(c, distTxt) {
    const specs = GH.specialties().filter(s => (c.especialidades || []).includes(s.id));
    result.innerHTML = `
      <div class="campus-card hero-pick">
        <div class="campus-card-head"><strong>📍 ${GH.esc(c.nombre)}</strong>${distTxt ? `<span class="campus-dist">${GH.esc(distTxt)}</span>` : ''}</div>
        <p class="muted">${GH.esc(c.direccion)} · ${GH.esc(c.ciudad)}</p>
        <p><strong>¿Qué te interesa? Marca una o varias:</strong></p>
        <div class="spec-pick">${specs.map(s => `
          <label class="spec-check"><input type="checkbox" value="${s.id}" ${preSpecs.includes(s.id) ? 'checked' : ''}>
          <span class="spec-check-title">${s.icon} ${GH.esc(s.nombre)}</span></label>`).join('')}</div>
        <div class="form-row">
          <div class="form-group"><label>Nombre (opcional)</label><input id="hero-nombre" placeholder="Para que te atiendan por tu nombre"></div>
          <div class="form-group"><label>Teléfono (opcional)</label><input id="hero-tel" placeholder="10 dígitos" inputmode="tel" maxlength="18"></div>
        </div>
        <div class="form-error" id="hero-err"></div>
        <div class="campus-card-actions">
          <button class="btn-submit" id="hero-send">Enviar por WhatsApp</button>
          <a class="btn-map btn-map-directions btn-sm" href="${GH.mapsUrl(c)}" target="_blank" rel="noopener">🗺️ Cómo llegar</a>
          <a class="btn-map btn-map-other btn-sm" href="/planteles/${c.slug}">Ver plantel</a>
        </div>
      </div>`;
    try { GH.setContext(c.id, []); } catch (e) {}
    GHtrack('campus_selected', { campus: c.nombre });
    document.getElementById('hero-send').addEventListener('click', () => {
      const checked = Array.from(result.querySelectorAll('input[type="checkbox"]:checked')).map(x => x.value);
      const err = document.getElementById('hero-err');
      if (!checked.length) { err.textContent = 'Marca al menos una especialidad.'; return; }
      err.textContent = '';
      const nombreEl = document.getElementById('hero-nombre');
      const telEl = document.getElementById('hero-tel');
      const nombre = (nombreEl.value || '').trim();
      const tel = GH.normPhone((telEl.value || '').trim());
      // Incentivo previo al envío: si faltan datos, invitar a completarlos
      if ((!nombre || !tel) && !result.dataset.nudged) {
        result.dataset.nudged = '1';
        err.innerHTML = `🎁 <strong>DEJA TUS DATOS Y RECIBE UN DESCUENTO ESPECIAL.</strong> Completa tu nombre y teléfono para que el plantel te atienda mejor.<br><button class="btn-primary btn-sm" id="hero-send-anyway" style="margin-top:8px">Enviar así de todos modos</button>`;
        (nombre ? telEl : nombreEl).focus();
        document.getElementById('hero-send-anyway').addEventListener('click', () => {
          result.dataset.nudged = '2';
          document.getElementById('hero-send').click();
        });
        return;
      }
      const msg = `Hola, me interesa estudiar en *${c.nombre}*%0A%0A` +
        `🎓 *Especialidades:* ${checked.map(id => encodeURIComponent(specName(id))).join(', ')}%0A` +
        (nombre ? `👤 *Nombre:* ${encodeURIComponent(nombre)}%0A` : '') +
        (tel ? `📞 *Teléfono:* ${tel}%0A` : '');
      GHtrack('whatsapp_click', { context: 'hero-finder', campus: c.nombre });
      try { GH.logEvento('whatsapp', { detalle: 'hero-finder', plantel: c.nombre, nombre, telefono: tel }); } catch (e) {}
      window.open(`https://wa.me/${(c.whatsapp || '529515678678').replace(/\D/g, '')}?text=${msg}`, '_blank');
      // Cupón inmediato: código + descarga + compartir
      const abc = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
      let code = 'GH-';
      const rnd = window.crypto && crypto.getRandomValues ? crypto.getRandomValues(new Uint8Array(4)) : [1, 2, 3, 4];
      for (let i = 0; i < 4; i++) code += abc[rnd[i] % abc.length];
      try { sessionStorage.setItem('gh_cupon', code); } catch (e) {}
      GHtrack('coupon_generated', { coupon: code, via: 'hero' });
      showCouponPopup(c, code);
    });

    function showCouponPopup(c, code) {
      const oldPop = document.getElementById('coupon-popup');
      if (oldPop) oldPop.remove();
      const ov = document.createElement('div');
      ov.className = 'coupon-popup';
      ov.id = 'coupon-popup';
      ov.innerHTML = `
      <div class="coupon-popup-card">
        <button class="coupon-popup-close" aria-label="Cerrar">✕</button>
        <img src="/img/logotipo.png" alt="Grupo Holandés" class="coupon-popup-logo">
        <p class="coupon-popup-kicker">🎁 ¡TU MENSAJE FUE ENVIADO!</p>
        <h3>DEJA TUS DATOS Y RECIBE UN DESCUENTO ESPECIAL EN TU PROCESO DE INSCRIPCIÓN</h3>
        <strong class="coupon-code">${code}</strong>
        <span class="coupon-note">$100 de descuento al agendar tu visita e inscribirte en ${GH.esc(c.nombre)}. <a href="/terminos-cupon" target="_blank" rel="noopener">Términos</a></span>
        <div class="frow">
          <button class="btn-map btn-map-directions" id="hero-dl">⬇️ Descargar</button>
          <button class="btn-map btn-map-whatsapp" id="hero-share">📤 Compartir</button>
        </div>
        <a href="/registro?plantel=${c.id}" class="btn-primary" style="width:100%;justify-content:center;margin-top:10px">Validar mi cupón →</a>
      </div>`;
      document.body.appendChild(ov);
      requestAnimationFrame(() => ov.classList.add('show'));
      ov.querySelector('.coupon-popup-close').addEventListener('click', () => ov.remove());
      ov.addEventListener('click', e => { if (e.target === ov) ov.remove(); });
      document.getElementById('hero-dl').addEventListener('click', () => {
        const cv = document.createElement('canvas');
        cv.width = 900; cv.height = 520;
        const x = cv.getContext('2d');
        x.fillStyle = '#1a1a2e'; x.fillRect(0, 0, 900, 520);
        x.strokeStyle = '#e10600'; x.lineWidth = 10; x.strokeRect(14, 14, 872, 492);
        x.fillStyle = '#ffffff'; x.textAlign = 'center';
        x.font = '800 44px Inter, Arial';
        x.fillText('GRUPO HOLANDÉS', 450, 100);
        x.fillStyle = '#ffd666'; x.font = '700 30px Inter, Arial';
        x.fillText('CUPÓN DE DESCUENTO ESPECIAL', 450, 160);
        x.fillStyle = '#ffffff'; x.font = '900 96px Inter, Arial';
        x.fillText(code, 450, 290);
        x.font = '400 30px Inter, Arial';
        x.fillText('$100 de descuento al agendar tu', 450, 360);
        x.fillText('visita e inscribirte', 450, 400);
        x.fillStyle = '#ffd666'; x.font = '400 26px Inter, Arial';
        x.fillText(c.nombre.toUpperCase().slice(0, 42), 450, 460);
        const a = document.createElement('a');
        a.download = code + '.png';
        a.href = cv.toDataURL('image/png');
        a.click();
        GHtrack('coupon_downloaded', { coupon: code });
      });
      document.getElementById('hero-share').addEventListener('click', () => {
        const txt = `¡Tengo un cupón de Grupo Holandés! Código ${code}: $100 de descuento al agendar mi visita e inscribirme en ${c.nombre}. Pide el tuyo aquí: ${location.origin}/registro?plantel=${c.id}`;
        window.open('https://wa.me/?text=' + encodeURIComponent(txt), '_blank');
        GHtrack('coupon_shared', { coupon: code });
      });
    }
    result.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  document.getElementById('hero-geo').addEventListener('click', () => {
    GHtrack('click_find_campus', { via: 'hero' });
    note.textContent = '📍 Solicitando permiso de ubicación…';
    result.innerHTML = '';
    if (!navigator.geolocation) { note.textContent = '🔒 Tu navegador no soporta geolocalización. Usa el buscador.'; return; }
    navigator.geolocation.getCurrentPosition(pos => {
      GHtrack('location_permission_granted', {});
      const near = findNearestCampus(pos.coords.latitude, pos.coords.longitude);
      if (!near.length) { note.textContent = 'Usa el buscador manual.'; return; }
      const top = near[0];
      const d = typeof formatDistance === 'function' ? formatDistance(top.distancia) : top.distancia.toFixed(1) + ' km';
      note.textContent = `✅ Tu plantel más cercano está a ${d}:`;
      showCampus(top, d);
    }, () => {
      GHtrack('location_permission_denied', {});
      note.textContent = '🔒 Sin permiso. Usa el buscador manual de arriba.';
    }, { enableHighAccuracy: true, timeout: 10000 });
  });

  document.getElementById('hero-q').addEventListener('input', e => {
    const list = searchCampuses(e.target.value).slice(0, 4);
    if (!e.target.value.trim()) { result.innerHTML = ''; note.textContent = ''; return; }
    note.textContent = list.length ? '👆 Elige tu plantel:' : 'Sin resultados. Prueba con “Oaxaca” o “San Martín”.';
    result.innerHTML = list.map(c => `
      <div class="campus-card"><div class="campus-card-head"><strong>📍 ${GH.esc(c.nombre)}</strong></div>
      <p class="muted">${GH.esc(c.ciudad)}, ${GH.esc(c.estado)}</p>
      <button class="btn-primary btn-sm" data-pick="${c.id}">Elegir este plantel</button></div>`).join('');
    result.querySelectorAll('[data-pick]').forEach(b => b.addEventListener('click', () => {
      const c = GH.campusById(b.dataset.pick);
      if (c) { note.textContent = ''; showCampus(c, null); }
    }));
  });
});
</script>
</body>
</html>
